# Desktop apps (Tauri): a thin window around the live site, see docs/desktop.md.
# A tag like v0.2.0 builds all systems and publishes them as a GitHub release,
# which the start page links to (/releases/latest). Run it by hand to only build and test.
name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles msi,nsis
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci

      # The tag decides the version (v0.2.0 → 0.2.0); MSI only takes plain numbers.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(f, "utf8"));
            conf.version = process.env.GITHUB_REF_NAME.slice(1);
            fs.writeFileSync(f, JSON.stringify(conf, null, 2));
          '

      # Signing only with the secrets from docs/desktop.md; without them the apps are built unsigned
      # (Gatekeeper and SmartScreen warn). Empty variables would make Tauri try to sign anyway.
      - name: Apple signing, if set up
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
          fi
          if [ -n "$APPLE_ID" ]; then
            for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: HiveVoice ${{ github.ref_name }}
          releaseBody: |
            HiveVoice für den Desktop. Windows: .msi oder -setup.exe, Mac: .dmg (Apple Silicon und Intel), Linux: .AppImage oder .deb.
            Solange die Apps nicht signiert sind, warnen Windows und macOS beim ersten Start; so geht es trotzdem: https://github.com/dafiiit/HiveVoice/blob/main/docs/desktop.md#ohne-signatur-starten
          releaseDraft: false
          prerelease: false

      # Manual runs publish nothing; the files are kept with the run instead.
      - name: Keep files with the run
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: hivevoice-${{ runner.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
